name: Scan Windows artifact
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build run ID (leave blank for the latest successful build)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select existing build
        id: build
        shell: pwsh
        env:
          REQUESTED_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force scan-report | Out-Null
          $headers = @{Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'}
          $base = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions"
          $id = $env:REQUESTED_RUN_ID.Trim()
          if ($id -and $id -notmatch '^\d+$') { throw 'Enter only the numeric build run ID.' }
          if (-not $id) {
            $runs = Invoke-RestMethod -Headers $headers -Uri "$base/workflows/windows-build.yml/runs?status=success&per_page=1"
            if (-not $runs.workflow_runs.Count) { throw 'No successful Windows build found.' }
            $id = [string]$runs.workflow_runs[0].id
          }
          $run = Invoke-RestMethod -Headers $headers -Uri "$base/runs/$id"
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw 'Choose a completed, successful build with the release artifact.'
          }
          $run | Select-Object -Property @('id'; 'html_url'; 'head_sha'; 'path'; 'status'; 'conclusion') |
            ConvertTo-Json | Set-Content -Encoding utf8 scan-report/build-run.json
          "run_id=$id" >> $env:GITHUB_OUTPUT
          Write-Host "Scanning existing build: $($run.html_url)"
      - name: Download existing release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OfflinePDF-Windows-x64
          path: artifact-input
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Scan portable files with Microsoft Defender
        shell: pwsh
        run: "& './packaging/scan_windows_artifact.ps1' -InputDirectory 'artifact-input' -ReportDirectory 'scan-report'"
      - name: Upload diagnostic report even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflinePDF-antivirus-report
          path: scan-report/
          if-no-files-found: warn
          retention-days: 14
