name: Build Windows x64
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never pushes; keep the token out of the checked-out repository.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Ensure Inno Setup 6 for the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Test and build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Require expected outputs
        shell: pwsh
        run: |
          @('release/OfflinePDF-Windows-x64-portable.zip','release/OfflinePDF-Setup-Windows-x64.exe','release/SHA256SUMS.txt') | ForEach-Object {
            if (!(Test-Path $_)) { throw "Missing artifact: $_" }
          }
          # The AGPL Corresponding Source, published beside the program files.
          $source = @(Get-ChildItem 'release' -Filter 'OfflinePDF-*-source.zip')
          if ($source.Count -ne 1) { throw 'Expected exactly one source archive.' }
          if ((Get-Content 'release/SHA256SUMS.txt' -Raw) -notmatch [regex]::Escape($source[0].Name)) {
            throw 'The source archive is missing from SHA256SUMS.txt.'
          }
      - name: Verify portable ZIP and offline firewall behavior
        shell: pwsh
        run: ./packaging/verify_windows_build.ps1
      - name: Verify installer (silent install, self-test, uninstall)
        shell: pwsh
        run: ./packaging/verify_installer.ps1
      - name: Upload validation reports even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflinePDF-validation
          path: release/validation/
          if-no-files-found: ignore
      - name: Upload portable bundle and installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OfflinePDF-Windows-x64
          path: |
            release/OfflinePDF-Windows-x64-portable.zip
            release/OfflinePDF-Setup-Windows-x64.exe
            release/OfflinePDF-*-source.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
