name: Build Windows x64
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Require expected outputs
        shell: pwsh
        run: |
          @('release/OfflinePDF-Windows-x64-portable.zip','release/SHA256SUMS.txt') | ForEach-Object {
            if (!(Test-Path $_)) { throw "Missing artifact: $_" }
          }
      - name: Verify portable ZIP and offline firewall behavior
        shell: pwsh
        run: ./packaging/verify_windows_build.ps1
      - name: Upload validation reports even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OfflinePDF-validation
          path: release/validation/
          if-no-files-found: ignore
      - name: Upload portable bundle
        uses: actions/upload-artifact@v7
        with:
          name: OfflinePDF-Windows-x64
          path: |
            release/OfflinePDF-Windows-x64-portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
